<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}铁路票务日结发布台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">铁路票务 · 日结发布台</a>
  <nav>
    <a href="{{ url_for('upload_page') }}">上传与预览</a>
    <a href="{{ url_for('contracts_page') }}">下游契约</a>
    <a href="{{ url_for('index') }}">发布记录</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer>
  <p>原件与两份下游文件按同一日修订号发布和下载；每次发布不可变。文件上限 1 MB。</p>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
